spring.application.name=PlantOrganizer

# --- Local secrets ---------------------------------------------------------
# Real API keys live in .env at the project root (git-ignored).
# Copy .env.example to .env and fill in your keys. "optional:" lets the app
# start even if .env is missing (features that need a key will report it).
spring.config.import=optional:file:.env[.properties]

plantorganizer.cohere.api-key=${COHERE_API_KEY:}
plantorganizer.perenual.api-key=${PERENUAL_API_KEY:}
plantorganizer.plantnet.api-key=${PLANTNET_API_KEY:}

# --- Database --------------------------------------------------------------
# H2 stored in a local file (./data), running in PostgreSQL compatibility mode.
# To switch to a real PostgreSQL server later, change these four lines and
# add the org.postgresql:postgresql dependency to pom.xml.
spring.datasource.url=jdbc:h2:file:./data/plantorganizer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/plantorganizer, user: sa, no password)
spring.h2.console.enabled=true
