spring.application.name=PlantOrganizer

# --- Local secrets ---------------------------------------------------------
# Real API keys live in .env at the project root (git-ignored).
# Copy .env.example to .env and fill in your keys. "optional:" lets the app
# start even if .env is missing (features that need a key will report it).
spring.config.import=optional:file:.env[.properties]

plantorganizer.cohere.api-key=${COHERE_API_KEY:}
plantorganizer.perenual.api-key=${PERENUAL_API_KEY:}
plantorganizer.plantnet.api-key=${PLANTNET_API_KEY:}
# Optional: which Cohere chat model the agent uses (see docs.cohere.com/docs/models)
plantorganizer.cohere.model=${COHERE_MODEL:command-a-03-2025}
# Vision model for photos (F03 timetable photos, F05 plant health photos)
plantorganizer.cohere.vision-model=${COHERE_VISION_MODEL:command-a-vision-07-2025}

# --- External API calls ------------------------------------------------------
plantorganizer.http.connect-timeout-seconds=10
plantorganizer.http.read-timeout-seconds=60

# --- Reminders (F04) ---------------------------------------------------------
# How often the reminder timer runs, and how long after its due time a
# watering counts as missed.
plantorganizer.notifications.check-interval-ms=60000
plantorganizer.notifications.overdue-after-hours=24

# --- Photo uploads (F01, F03, F05) --------------------------------------------
# Spring's default limit is 1 MB, smaller than most phone photos.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# --- Database --------------------------------------------------------------
# H2 stored in a local file (./data), running in PostgreSQL compatibility mode.
# To switch to a real PostgreSQL server later, change these four lines and
# add the org.postgresql:postgresql dependency to pom.xml.
spring.datasource.url=jdbc:h2:file:./data/plantorganizer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/plantorganizer, user: sa, no password)
spring.h2.console.enabled=true
